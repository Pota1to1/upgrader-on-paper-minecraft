name: Upgrader
version: '1.1.0'
main: com.upgrader.UpgraderPlugin
api-version: '26.3'
author: you
description: Gamble any item for a chosen upgrade, odds driven by item value.
commands:
  upgrader:
    description: Get an Upgrader item, or reload the config
    usage: /upgrader [reload]
    permission: upgrader.give
    permission-message: You don't have permission for that.
permissions:
  upgrader.give:
    description: Allows getting the Upgrader item via command
    default: op
  upgrader.admin:
    description: Allows /upgrader reload
    default: op
