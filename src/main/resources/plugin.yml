name: Upgrader
version: '1.1.0'
main: com.upgrader.UpgraderPlugin
api-version: '26.3'
author: you
description: Gamble any item for a chosen upgrade, odds driven by item value.
commands:
 commands:
  upgrader:
    description: Open the Upgrader (or /upgrader give, /upgrader reload)
    usage: /upgrader [give|reload]
permissions:
  upgrader.use:
    description: Allows opening the Upgrader with /upgrader
    default: true
  upgrader.give:
    description: Allows getting the Upgrader item with /upgrader give
    default: op
  upgrader.admin:
    description: Allows /upgrader reload
    default: op
